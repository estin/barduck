name: Release

# Runs once per version tag (pushed by `just release`). The "Run workflow"
# button (or `gh workflow run release.yml --ref v<version>`) retries a
# release on an existing tag; the tagged commit must contain this file.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Never publish the same tag twice in parallel.
concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Ships the release artifact on version tags: one static musl binary
  # (DuckDB compiled in via `--features bundled`, no system dependency)
  # plus its matching asset bundle, verified by `release-check` before
  # upload. The tag must equal the package version (checked below).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the full history and tags for the release notes.
          fetch-depth: 0

      - name: Install Rust and musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools, just, git-cliff and topcoat CLI
        uses: taiki-e/install-action@v2
        with:
          tool: just,git-cliff
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Pinned to the topcoat version in Cargo.lock: a skew here produces
      # a bundle whose asset ids don't match the binary (see `just run`).
      - run: cargo install topcoat-cli --version 0.9.0 --locked

      - name: Check tag matches package version
        run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "barduck") | .version')" = "${{ github.ref_name }}"

      - name: Release smoke test (musl, bundled)
        run: just release-check
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
          BUNDLE_TARGET_DIR: target/x86_64-unknown-linux-musl
          RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=yes

      - name: Package artifact
        run: |
          DIR="target/x86_64-unknown-linux-musl/release"
          tar -czf "barduck-${{ github.ref_name }}-linux-x86_64.tar.gz" -C "$DIR" barduck assets

      - name: Generate release notes
        run: git cliff --latest --strip header -o RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: barduck-${{ github.ref_name }}-linux-x86_64.tar.gz
