name: Release

# Runs once per version tag (pushed by `just release`). The "Run workflow"
# button (or `gh workflow run release.yml --ref v<version>`) retries a
# release on an existing tag; the tagged commit must contain this file.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Never publish the same tag twice in parallel.
concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Ships the release artifact on version tags: one static musl binary
  # (DuckDB compiled in via `--features bundled`, no system dependency)
  # plus its matching asset bundle, verified by `release-check` before
  # upload. The tag must equal the package version (checked below).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Bundled DuckDB is C++, and Ubuntu's `musl-tools` ships only a musl C
    # compiler (no `x86_64-linux-musl-g++`). This image carries a full musl
    # gcc/g++ cross toolchain; cc-rs and rustc are pointed at it below.
    container: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl
    permissions:
      contents: write
    env:
      CC_x86_64_unknown_linux_musl: x86_64-unknown-linux-musl-gcc
      CXX_x86_64_unknown_linux_musl: x86_64-unknown-linux-musl-g++
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the full history and tags for the release notes.
          fetch-depth: 0
      # The checkout is owned by the runner user, not the container's root;
      # without this git (and git-cliff) refuse the "dubious" repository.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The image's preinstalled `stable` can't be updated in place (rustup
      # fails removing a component it never had), and topcoat needs a newer
      # rustc than the image ships, so reinstall it from scratch.
      - run: rustup toolchain uninstall stable
      - name: Install Rust and musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install just, git-cliff, jq and topcoat CLI
        uses: taiki-e/install-action@v2
        with:
          tool: just,git-cliff
      - run: apt-get update && apt-get install -y jq
      # Pinned to the topcoat version in Cargo.lock: a skew here produces
      # a bundle whose asset ids don't match the binary (see `just run`).
      - run: cargo install topcoat-cli --version 0.9.0 --locked

      # `topcoat asset bundle` (in `release-check`) rebuilds the binary
      # itself and strips every CARGO_* / RUSTFLAGS env var first, so the
      # musl target and linker must come from a config file to reach that
      # build too; musl static linking is rustc's default. After the tool
      # installs above, which stay native.
      - name: Target musl for every cargo build
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [build]
          target = "x86_64-unknown-linux-musl"

          [target.x86_64-unknown-linux-musl]
          linker = "x86_64-unknown-linux-musl-gcc"
          EOF

      - name: Check tag matches package version
        run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "barduck") | .version')" = "${{ github.ref_name }}"

      - name: Release smoke test (musl, bundled)
        run: just release-check
        env:
          BUNDLE_TARGET_DIR: target/x86_64-unknown-linux-musl

      - name: Package artifact
        run: |
          DIR="target/x86_64-unknown-linux-musl/release"
          tar -czf "barduck-${{ github.ref_name }}-linux-x86_64.tar.gz" -C "$DIR" barduck assets

      - name: Generate release notes
        run: git cliff --latest --strip header -o RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: barduck-${{ github.ref_name }}-linux-x86_64.tar.gz

  # Re-pins the flake's `barduck-bin` package (nix/release.json) to the
  # tarball just published, on master. Separate from `release` so a failed
  # pin never blocks or rolls back a published release; rerun it alone
  # via "Re-run failed jobs".
  update-nix:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: extractions/setup-just@v2
      - run: just release-pin "${{ github.ref_name }}"
      - name: Commit nix/release.json
        run: |
          git diff --quiet -- nix/release.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(nix): pin barduck-bin to ${{ github.ref_name }}" -- nix/release.json
          git pull --rebase origin master
          git push origin HEAD:master
