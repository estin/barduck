name: CI

on:
  push:
    branches: [master]
    # Version tags (`just release`) must trigger the workflow too, or the
    # `release` job below never runs: a `branches`-only filter excludes
    # tag pushes.
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Lets libduckdb-sys download a matching prebuilt libduckdb at build time
  # instead of requiring a system package or compiling DuckDB from source —
  # matches `just ci`'s default (unbundled) feature set with no extra setup.
  DUCKDB_DOWNLOAD_LIB: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `just` runs the `ci` recipe below; `cargo-nextest` is what it runs.
      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: just ci
        run: just ci

  # Deliberately a separate job from `ci`: `--all-features` turns on
  # `bundled`, which compiles DuckDB from source instead of downloading a
  # prebuilt library (see `DUCKDB_DOWNLOAD_LIB` above). That is far too slow
  # for the every-push path, but it is the only build that exercises the
  # bundled feature at all, so it still runs on every PR.
  all-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: just ci-all-features
        run: just ci-all-features

  native-processes:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `cfg(windows)`/`cfg(unix)` halves of the tree only exist on this
      # matrix, so without clippy here they would ship with zero lint
      # coverage — the `ci` job's clippy run never compiles them.
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      # Existing dashboard fixtures use POSIX commands. This suite runs
      # native shell commands and observes both generations of a real tree.
      - name: Test native command execution and process cleanup
        run: cargo test --test process_lifecycle

  # Ships the release artifact on version tags: one static musl binary
  # (DuckDB compiled in via `--features bundled`, no system dependency)
  # plus its matching asset bundle, verified by `release-check` before
  # upload. The tag must equal the package version (checked below).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools, just and topcoat CLI
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Pinned to the topcoat version in Cargo.lock: a skew here produces
      # a bundle whose asset ids don't match the binary (see `just run`).
      - run: cargo install topcoat --version 0.9.0 --locked

      - name: Check tag matches package version
        run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "${{ github.ref_name }}"

      - name: Release smoke test (musl, bundled)
        run: just release-check
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
          BUNDLE_TARGET_DIR: target/x86_64-unknown-linux-musl
          RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=yes

      - name: Package artifact
        run: |
          DIR="target/x86_64-unknown-linux-musl/release"
          tar -czf "barduck-${{ github.ref_name }}-linux-x86_64.tar.gz" -C "$DIR" barduck assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: barduck-${{ github.ref_name }}-linux-x86_64.tar.gz
