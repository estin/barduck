# Demo config for barduck.
# All paths below (database_path, source/setup commands) resolve relative to
# this file's directory. Build once from the repo root, then run from anywhere:
#   cargo build --release
#   ./target/release/barduck --config demo/config.toml daemon
#
# Structured to mirror a real self-hosted dashboard: the same composite
# children, slow intervals, show_in/show_history flags, and generalized panes
# (main + secondary + table) the real-world config uses — backed by harmless
# shell commands instead of whois/curl/API calls.

database_path = "dashboard.duckdb"
listen = "127.0.0.1:18420"

# A source flips to "failing" after this many consecutive failures, and to
# "stale" once it has missed its second expected call on its own schedule.
failure_threshold = 2

# ── Host health ──────────────────────────────────────────────────────────────

# Composite: one `uptime` parse fans out to three children, each displayed and
# healthed independently. Bare "load-averages" in a layout renders a table of
# all three; "load-averages::5m" addresses one child.
[[sources]]
name = "load-averages"
type = "query"
command = "sh scripts/load-averages.sh"
interval = "10s"

[[sources.children]]
name = "1m"
title = "load 1m"
unit = "avg"
thresholds = [
    { bound = 2.0, level = "green" },
    { bound = 4.0, level = "yellow" },
    { bound = 8.0, level = "red" },
]

[[sources.children]]
name = "5m"
title = "load-5m"
unit = "avg"
thresholds = [
    { bound = 2.0, level = "green" },
    { bound = 4.0, level = "yellow" },
    { bound = 8.0, level = "red" },
]

[[sources.children]]
name = "15m"
title = "load-15m"
unit = "avg"
thresholds = [
    { bound = 2.0, level = "green" },
    { bound = 4.0, level = "yellow" },
    { bound = 8.0, level = "red" },
]

# Root disk fills slowly; thresholds are green → yellow → red with a history
# bar (default for banded sources).
[[sources]]
name = "disk-root"
title = "Root filesystem"
type = "query"
command = "df / --output=pcent | tail -1 | tr -d ' %'"
unit = "%"
interval = "1h"  # hourly — cheap local check, like the real config's `disk`
thresholds = [
    { bound = 85.0, level = "green" },
    { bound = 95.0, level = "yellow" },
    { bound = 100.0, level = "red" },
]

# /home disk: same composite pattern, but opts out of the history bar even
# though it's banded — daily-slow sources have little history to show.
[[sources]]
name = "disk-home"
type = "query"
command = "df /home --output=pcent | tail -1 | tr -d ' %'"
unit = "%"
interval = "1h"
show_history = false
thresholds = [
    { bound = 85.0, level = "green" },
    { bound = 95.0, level = "yellow" },
    { bound = 100.0, level = "red" },
]

# Simulated CPU temperature: a random value in a plausible range. History bar
# makes the variation visible; the real config checks hwmon sensors instead.
[[sources]]
name = "cpu-temp"
type = "query"
command = "awk 'BEGIN{srand(); printf \"%.1f\", 55 + rand()*10}'"
unit = "°C"
interval = "30s"
thresholds = [
    { bound = 70.0, level = "green" },
    { bound = 85.0, level = "yellow" },
    { bound = 100.0, level = "red" },
]

# Composite: one `free -b` parse covers both memory and swap, like the real
# config's `memory` source.
[[sources]]
name = "memory"
type = "query"
command = "sh scripts/mem-usage.sh"
interval = "30s"

[[sources.children]]
name = "mem"
title = "mem used"
unit = "%"
thresholds = [
    { bound = 80.0, level = "green" },
    { bound = 95.0, level = "yellow" },
    { bound = 100.0, level = "red" },
]

[[sources.children]]
name = "swap"
title = "swap used"
unit = "%"
thresholds = [
    { bound = 50.0, level = "green" },
    { bound = 80.0, level = "yellow" },
    { bound = 100.0, level = "red" },
]

# ── Money and quotas ─────────────────────────────────────────────────────────

# Plain single value; the "Cloud balance" pane groups it with usage below.
[[sources]]
name = "cloud-balance"
title = "Cloud API balance"
type = "query"
command = "echo 1480.42"
unit = "USD"
interval = "5m"
thresholds = [
    { bound = 0.5, level = "red" },
    { bound = 1.0, level = "yellow" },
    { bound = 100000.0, level = "green" },
]

# Same value but banded in the opposite direction (more is greener) AND
# carrying replacement bands in its own jsonl row — the row wins over the
# declared thresholds. Watch the panel take the row's bands.
[[sources]]
name = "cloud-usage"
title = "Cloud usage today"
type = "query"
command = "echo '{\"value\":\"1.24\",\"threshold\":[{\"bound\":1.0,\"level\":\"green\"},{\"bound\":3.0,\"level\":\"yellow\"},{\"bound\":100000.0,\"level\":\"red\"}]}'"
unit = "USD"
interval = "5m"
thresholds = [
    { bound = 1.0, level = "green" },
    { bound = 3.0, level = "yellow" },
    { bound = 100000.0, level = "red" },
]

# ── Sites ────────────────────────────────────────────────────────────────────

# Composite over one command: HTTP status + TLS cert days remaining, the way
# site checks really pair up. A stable value here so the pane reads green.
[[sources]]
name = "site-status"
title = "status"
type = "query"
command = "echo '[{\"source\":\"site-status::code\",\"value\":\"200\"},{\"source\":\"site-status::cert-days\",\"value\":\"214\"}]'"
interval = "10m"
timeout = "30s"

[[sources.children]]
name = "code"
unit = "code"
thresholds = [
    { bound = 299, level = "green" },
    { bound = 399, level = "yellow" },
    { bound = 599, level = "red" },
]

[[sources.children]]
name = "cert-days"
unit = "days"
show_history = false
thresholds = [
    { bound = 13, level = "red" },
    { bound = 29, level = "yellow" },
    { bound = 3650, level = "green" },
]

# ── Deliberate demo states ───────────────────────────────────────────────────

# Setup commands run once before the first fetch. This one always succeeds;
# remove the file it checks for and restart to see a failing setup recover.
[[sources]]
name = "bank-balance"
type = "query"
setup = "test -f dashboard.duckdb"
command = "echo 1480.42"
unit = "USD"
interval = "5m"

# Deliberately unreachable: demonstrates the failing health state.
# `show_in = "tui"` keeps this noisy debug source out of the web dashboard
# (shown to other people) while it's still visible in the TUI during
# troubleshooting; it's still fetched on its schedule either way.
[[sources]]
name = "dead-service"
type = "query"
command = "sh -c 'exit 1'"
interval = "5s"
show_in = "tui"

# The web-only counterpart: fetched and visible only in the web UI, never in
# the TUI — e.g. a quick-links panel other people should see.
[[sources]]
name = "public-status-note"
title = "Status note"
type = "query"
command = "printf 'All systems nominal. Maintenance window: **none scheduled**.'"
format = "markdown"
interval = "1h"
show_in = "web"

# Setup fails until you run:  touch /tmp/bd-tunnel-up
# Demonstrates automatic recovery without restarting the daemon.
[[sources]]
name = "tunneled-service"
type = "query"
setup = "test -f /tmp/bd-tunnel-up"
command = "echo 1480.42"
unit = "USD"
interval = "30s"

# A stream source: a long-running command emitting one `jsonl` row per line.
# Emits a single value, then stays silent for 5 minutes — watch it turn
# amber (`stale`) once silence exceeds `expected_interval`.
[[sources]]
name = "quiet-stream"
type = "stream"
command = "echo '{\"value\":\"1\"}'; sleep 300"
expected_interval = "20s"
unit = "ticks"

# An ingest source: receives data via HTTP push. No command; data arrives
# via POST /api/ingest. Staleness is governed by expected_interval.
[[sources]]
name = "webhook-events"
type = "ingest"
expected_interval = "1m"
unit = "events"

# ── Layouts ──────────────────────────────────────────────────────────────────
# Grid layouts: each row is a list of cells. A panel's title defaults to its
# source's `title` (see `disk-root` above), or its raw name if it declares
# none.
#   "source"                        -> panel titled after the source
#   { id = "src", title = "X" }     -> panel with custom title
#   { kind = "space", colspan = N } -> empty spacer spanning N columns
#   { title = "X", main = ..., secondary = [...], table = [...] }
#                                   -> one generalized pane combining up to
#                                      three sections (at least one required):
#                                      `main` (one value, rendered full-size
#                                      like a regular panel, with its own
#                                      history bar), `secondary` (compact
#                                      values, no history bar), and `table`
#                                      (N labeled, independently colored rows,
#                                      as before). The pane's own border/
#                                      history matches the worst member across
#                                      all three. A `main`/`secondary`/`table`
#                                      entry is a bare source name (label =
#                                      that source's `title`, or its name) or
#                                      { id = "src", label = "Label" }
#   { title? = "X", format? = "markdown", text = "..." }
#                                   -> a standalone static-text panel: `text`
#                                      is authored directly in the layout, no
#                                      `[[sources]]` entry at all — no
#                                      schedule, health, log view, or
#                                      summary-strip chip. Renders like any
#                                      other source's `format` (markdown as
#                                      HTML, else plain text); the TUI always
#                                      shows it as-is.
#
# A source may also declare `show_in = "tui"` or `show_in = "web"` (default
# "all") to restrict which UI displays it — see `dead-service` above. This
# only affects display placement; the source is still collected on schedule.
# Layout style overrides (spec: web-ui — layout style overrides).
# Each layout and cell can have a `style` field with CSS property overrides
# rendered as inline styles on the panel grid and cards.
# Examples:
#   [[layouts]]
#   title = "Monospace"
#   style = { font_family = "monospace" }     # all panels in this layout use monospace
#   rows = [
#       [{ main = "source-name", style = { font_size = "18px" } }],  # per-cell override
#   ]
#
# Supported CSS properties: any property-value pair (e.g., font_family,
# font_size, background_color, gap). Values are strings passed through
# as-is in the inline style attribute.

[[layouts]]
title = "Host"
style = { font_family = "monospace" }
rows = [
    [
        { title = "This host", main = "load-averages::5m", secondary = ["memory::mem", "memory::swap"], table = [{ id = "disk-home", label = "home" }] },
        { title = "Root filesystem", main = "disk-root" },
        { title = "CPU temperature", main = "cpu-temp" },
    ],
]

[[layouts]]
title = "Cloud & sites"
rows = [
    [
        { main = "cloud-balance", secondary = ["cloud-usage"], title = "Cloud API" },
        { main = "site-status::code", secondary = ["site-status::cert-days"], title = "demo site" },
        "tunneled-service",
        "quiet-stream",
        "webhook-events",
    ],
    [
        { main = "public-status-note" },
    ],
]

[[layouts]]
title = "Reports & misc"
rows = [
    [
        { title = "Server", main = "load-averages::1m", secondary = ["cloud-balance"], table = [{ id = "disk-home", label = "home" }] },
        "bank-balance",
    ],
    [{ id = "load-averages", title = "All load averages" }, { kind = "space" }, { id = "cloud-usage", title = "Balance bands" }],
    [
        { title = "Weekly report", format = "markdown", text = """
## Weekly report

Hours logged: **36.5 h** — incidents: **0**

- [x] incident review
- [x] on-call handover
- [ ] rotate log archive keys
""" },
        # TOML multi-line basic strings (`"""..."""`) work fine inside an
        # inline table; the newline right after the opening `"""` is
        # trimmed, so the content starts cleanly on the next line.
        { title = "Quick Links", format = "markdown", text = """
- [Status page](https://status.example.com)
- [Runbook](https://wiki.example.com/runbook)
- [On-call](https://wiki.example.com/oncall)
""" },
    ],
    # The bare "load-averages" reference auto-renders as a table of its
    # three children (1m/5m/15m) — no need to list them out.
    ["load-averages"],
]
