[package]
name = "barduck"
version = "0.1.5"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
croner = "4.0"
crossterm = "0.29"
duckdb = { version = "1.10505", features = ["chrono"] }
humantime = "2.4"
humantime-serde = "1.1"
process-wrap = { version = "9.0.3", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop", "creation-flags"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-core = "0.3"
serde_urlencoded = "0.7"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "signal", "net", "process", "io-util"] }
toml = "1.1"
topcoat = { version = "0.9", features = ["font-fontsource", "sse", "tailwind", "ui"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# There is no system libduckdb to link on musl, so every musl build compiles
# DuckDB in. Needed beyond `--features bundled` because `topcoat asset
# bundle` rebuilds the binary itself with no feature flags (see the
# `release` CI workflow). `json` is compiled in too: the schema uses the JSON
# type, and a static musl binary cannot autoload extensions at runtime.
[target.'cfg(target_env = "musl")'.dependencies]
duckdb = { version = "1.10505", features = ["bundled", "json"] }

[build-dependencies]
topcoat = { version = "0.9", default-features = false, features = ["tailwind"] }

[dev-dependencies]
tempfile = "3.27"
# `topcoat`'s own feature set has no passthrough for the asset *bundler*, so
# it's enabled here directly: the page-rendering tests build their own asset
# bundle in-process (see `test_asset_bundle`), which needs it. Dev-only, so the
# shipped binary never links the bundler.
topcoat-asset = { version = "0.9", features = ["bundler"] }

[features]
bundled = ["duckdb/bundled"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }

[profile.release.package.libduckdb-sys]
opt-level = 1
