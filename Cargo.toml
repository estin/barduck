[package]
name = "barduck"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
croner = "4.0"
crossterm = "0.29"
duckdb = { version = "1.10505", features = ["chrono"] }
humantime = "2.4"
humantime-serde = "1.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "signal", "net", "process", "io-util"] }
toml = "1.1"
topcoat = { version = "0.6", features = ["font-fontsource", "tailwind", "ui"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
topcoat = { version = "0.6", default-features = false, features = ["tailwind"] }

[dev-dependencies]
tempfile = "3.27"

[features]
bundled = ["duckdb/bundled"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }

[profile.release.package.libduckdb-sys]
opt-level = 1
